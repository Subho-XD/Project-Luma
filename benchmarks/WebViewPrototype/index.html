<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Project Luma WebView2 Benchmark</title>
<style>
  body { margin: 0; background: #0A0C10; color: #F1F5F9; font-family: system-ui; display: flex; height: 100vh; }
  aside { width: 220px; background: #0E1118; padding: 16px; border-right: 1px solid #1B1F2A; }
  main { flex: 1; padding: 16px; display: flex; flex-direction: column; overflow: hidden; }
  input { height: 32px; background: #080A0E; border: 1px solid #1B1F2A; color: #fff; padding: 0 10px; margin-bottom: 12px; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; overflow-y: auto; }
  .card { background: #0F1117; border: 1px solid #1B1F2A; border-radius: 6px; overflow: hidden; transition: transform .15s ease; }
  .card img { width: 100%; height: 240px; object-fit: cover; display: block; }
  .meta { padding: 8px; font-size: 12px; }
</style>
</head>
<body>
<aside><strong>PROJECT LUMA</strong></aside>
<main>
  <input id="q" placeholder="Search games..." />
  <div id="grid"></div>
</main>
<script>
const t0 = performance.now();
const grid = document.getElementById('grid');
const cover = 'file:///C:/Program%20Files%20(x86)/Steam/appcache/librarycache/4126040/093428100a3d889c1abf7f85a74a1ab1d86965cd/library_capsule.jpg';
const games = Array.from({length: 1000}, (_, i) => ({ title: `Sample Game Title #${String(i).padStart(4,'0')}`, status: i % 3 === 0 ? 'Ready to Enhance' : 'Enhanced' }));
const frag = document.createDocumentFragment();
for (const g of games) {
  const d = document.createElement('div');
  d.className = 'card';
  d.innerHTML = `<img loading="lazy" src="${cover}" /><div class="meta"><div>${g.title}</div></div>`;
  frag.appendChild(d);
}
grid.appendChild(frag);
const renderMs = performance.now() - t0;
const ts = performance.now();
const matches = games.filter(g => g.title.includes('042'));
const searchMs = performance.now() - ts;
document.title = `READY|render=${renderMs.toFixed(2)}|search=${searchMs.toFixed(2)}|count=${matches.length}`;
</script>
</body>
</html>
